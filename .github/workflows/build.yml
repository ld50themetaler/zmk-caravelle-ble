name: Build Caravelle BLE ZMK Firmware

on:
  push:
    paths:
      - 'config/**'
      - 'build.yaml'
      - 'tools/**'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  build:
    name: Build Firmware & OTA Packages
    runs-on: ubuntu-latest
    container:
      image: zmkfirmware/zmk-build-arm:stable
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache West Modules
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: |
            modules/
            tools/
            zephyr/
            bootloader/
            zmk/
          key: ${{ runner.os }}-zmk-${{ hashFiles('config/west.yml') }}
          restore-keys: |
            ${{ runner.os }}-zmk-

      - name: West Init
        run: |
          if [ ! -d .west ]; then
            west init -l config
          fi

      - name: West Update & Zephyr Export
        run: |
          west update --fetch-opt=--filter=tree:0
          west zephyr-export

      - name: Setup CMake Cache
        run: |
          mkdir -p build/left build/right
          cat << EOF > /tmp/extra_modules.cmake
          set(ZMK_EXTRA_MODULES "${PWD}/modules/zmk-feature-non-lipo-battery-management;${PWD}/modules/prospector-zmk-module" CACHE STRING "" FORCE)
          EOF
          echo "=== /tmp/extra_modules.cmake ==="
          cat /tmp/extra_modules.cmake


      - name: Build Left (Central)
        run: |
          west build -s zmk/app -d build/left -b caravelle --pristine -- \
            -DZMK_CONFIG="${PWD}/config" \
            -DSHIELD=caravelle_left \
            -DCONFIG_ZMK_SPLIT=y \
            -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=y \
            -C /tmp/extra_modules.cmake

      - name: Build Right (Peripheral)
        run: |
          west build -s zmk/app -d build/right -b caravelle --pristine -- \
            -DZMK_CONFIG="${PWD}/config" \
            -DSHIELD=caravelle_right \
            -DCONFIG_ZMK_SPLIT=y \
            -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n \
            -C /tmp/extra_modules.cmake

      - name: Generate Nordic DFU OTA Packages
        run: |
          pip3 install cryptography
          mkdir -p artifacts

          cp build/left/zephyr/zmk.hex artifacts/caravelle_left_central.hex
          cp build/left/zephyr/zmk.bin artifacts/caravelle_left_central.bin
          cp build/right/zephyr/zmk.hex artifacts/caravelle_right_peripheral.hex
          cp build/right/zephyr/zmk.bin artifacts/caravelle_right_peripheral.bin

          python3 tools/generate_ota.py \
            --bin artifacts/caravelle_left_central.bin \
            --key config/keys/private_key.pem \
            --app-version 1 \
            --hw-version 52 \
            --sd-req 0x00B6 \
            --out artifacts/caravelle_left_central_ota.zip

          python3 tools/generate_ota.py \
            --bin artifacts/caravelle_right_peripheral.bin \
            --key config/keys/private_key.pem \
            --app-version 1 \
            --hw-version 52 \
            --sd-req 0x00B6 \
            --out artifacts/caravelle_right_peripheral_ota.zip

          echo "=== Generated Artifacts ==="
          ls -la artifacts/

      - name: Upload Firmware Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: caravelle_ble_firmware
          path: artifacts/

